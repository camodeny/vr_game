<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>vr_game — basic VR shooter</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0f; font-family: system-ui, sans-serif; }
  #hud {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 12px; align-items: center; z-index: 10;
    background: rgba(0,0,0,.6); color: #fff; padding: 8px 16px; border-radius: 999px;
    font-weight: 600; user-select: none;
  }
  #hud button {
    border: 0; border-radius: 999px; padding: 6px 14px; font-weight: 700; cursor: pointer;
  }
  #help {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    color: #9999ad; font-size: 13px; z-index: 10; text-align: center;
    background: rgba(0,0,0,.5); padding: 6px 14px; border-radius: 8px;
  }
</style>
</head>
<body>
<div id="hud">
  <span>🎯 <span id="score">0</span></span>
  <button id="reset">Reset</button>
</div>
<div id="help">Desktop: drag to look, WASD to move, click targets &nbsp;•&nbsp; VR: hit “Enter VR”, point &amp; trigger</div>

<a-scene>
  <a-sky color="#0a0a0f"></a-sky>
  <a-plane position="0 0 0" rotation="-90 0 0" width="40" height="40" color="#1a1a24"></a-plane>
  <a-grid material="color: #33334d" position="0 0.01 0"></a-grid>

  <a-text id="scoreText" value="Score: 0" position="0 3 -4" align="center" width="8"></a-text>

  <a-entity id="rig" position="0 1.6 4">
    <a-camera wasd-controls look-controls>
      <a-cursor raycaster="objects: .target" color="#fff"></a-cursor>
    </a-camera>
    <a-entity laser-controls="hand: left" raycaster="objects: .target"></a-entity>
    <a-entity laser-controls="hand: right" raycaster="objects: .target"></a-entity>
  </a-entity>

  <a-entity id="targets"></a-entity>
</a-scene>

<script>
  const targetsEl = document.getElementById('targets');
  const scoreEl = document.getElementById('score');
  const scoreText = document.getElementById('scoreText');
  let score = 0;
  const COUNT = 6;

  function setScore(n) {
    score = n;
    scoreEl.textContent = n;
    scoreText.setAttribute('value', 'Score: ' + n);
  }

  function randomPos() {
    const a = Math.random() * Math.PI * 2;
    const r = 2.5 + Math.random() * 4;
    return { x: Math.cos(a) * r, y: 0.8 + Math.random() * 2.5, z: Math.sin(a) * r - 1 };
  }

  function spawn(i) {
    const p = randomPos();
    const el = document.createElement('a-sphere');
    el.classList.add('target');
    el.setAttribute('position', `${p.x} ${p.y} ${p.z}`);
    el.setAttribute('radius', '0.3');
    el.setAttribute('color', `hsl(${Math.random() * 360}, 80%, 60%)`);
    el.setAttribute('animation', 'property: scale; to: 1.15 1.15 1.15; dir: alternate; dur: 800; loop: true');
    el.addEventListener('click', () => {
      setScore(score + 1);
      // pop effect then respawn
      const q = randomPos();
      el.setAttribute('position', `${q.x} ${q.y} ${q.z}`);
      el.setAttribute('color', `hsl(${Math.random() * 360}, 80%, 60%)`);
    });
    targetsEl.appendChild(el);
  }

  for (let i = 0; i < COUNT; i++) spawn(i);
  document.getElementById('reset').onclick = () => setScore(0);
</script>
</body>
</html>
