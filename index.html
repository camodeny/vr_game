<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRButton } from 'three/addons/webxr/VRButton.js';

// ============================================================
// renderer / scene
// ============================================================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);
scene.fog = new THREE.Fog(0x0a0a0f, 7, 20);

const rig = new THREE.Group();
scene.add(rig);
const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.04, 60);
camera.position.set(0, 1.6, 0);
rig.add(camera);

scene.add(new THREE.HemisphereLight(0x8899ff, 0x221122, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(3, 6, 2);
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(10, 48),
  new THREE.MeshStandardMaterial({ color: 0x14141d, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
scene.add(new THREE.GridHelper(20, 40, 0x444466, 0x262633));

// groups per mode
const fightGroup = new THREE.Group(); scene.add(fightGroup);
const labGroup = new THREE.Group(); scene.add(labGroup);
const mechRoot = new THREE.Group(); labGroup.add(mechRoot);

// ============================================================
// shared helpers
// ============================================================
const V = THREE.Vector3;
function segHitsSphere(a, b, c, r) {
  const ab = new V().subVectors(b, a);
  const t = THREE.MathUtils.clamp(new V().subVectors(c, a).dot(ab) / (ab.lengthSq() || 1e-6), 0, 1);
  return new V().copy(a).addScaledVector(ab, t).distanceTo(c) <= r;
}
function worldPos(o, out = new V()) { return o.getWorldPosition(out); }

function disposeObj(o) {
  o.traverse?.((n) => {
    n.geometry?.dispose?.();
    if (Array.isArray(n.material)) n.material.forEach((m) => m.dispose?.());
    else n.material?.dispose?.();
  });
}

function makeBoard(w, h, worldW, worldH) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  const tex = new THREE.CanvasTexture(cv);
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(worldW, worldH),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));
  function draw(lines, color = '#fff') {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(0,0,0,.72)';
    ctx.fillRect(4, 4, w - 8, h - 8);
    ctx.textAlign = 'center';
    const arr = Array.isArray(lines) ? lines : [lines];
    const lh = h / (arr.length + 0.6);
    arr.forEach((ln, i) => {
      ctx.fillStyle = i === 0 ? color : '#cfcfe0';
      ctx.font = `bold ${i === 0 ? Math.round(lh * 0.62) : Math.round(lh * 0.46)}px system-ui, sans-serif`;
      ctx.fillText(ln, w / 2, lh * (i + 0.85), w - 24);
    });
    tex.needsUpdate = true;
  }
  return { mesh, draw, ctx, canvas: cv, tex };
}

// in-VR heads-up toast (parented to camera, renders inside headsets)
const hud3d = new THREE.Group();
hud3d.position.set(0, -0.19, -0.75);
camera.add(hud3d);
const toast = makeBoard(640, 128, 0.62, 0.124);
toast.mesh.position.set(0, 0, 0);
hud3d.add(toast.mesh);

// ============================================================
// audio
// ============================================================
let AC = null;
function initAudio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } }
function tone(type, f0, f1, dur, vol) {
  if (!AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur + 0.02);
  o.connect(g).connect(AC.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
const whoosh = (s) => tone('sawtooth', 170 + s * 55, 90, 0.18, 0.07);
const thud = () => tone('sine', 150, 50, 0.16, 0.22);
const buzz = () => tone('square', 110, 90, 0.28, 0.11);
const ding = () => tone('triangle', 900, 1400, 0.14, 0.13);
const zap = () => tone('square', 1400, 300, 0.12, 0.1);

function pulseHaptics(intensity, ms) {
  try {
    const gp = [...navigator.getGamepads()].find((g) => g && g.hapticActuators?.length);
    gp?.hapticActuators[0].pulse(intensity, ms);
  } catch {}
}

// ============================================================
// sword rig
// ============================================================
const swordAnchor = new THREE.Group();
swordAnchor.position.set(0.25, 1.4, 0.9);
scene.add(swordAnchor);
const baseObj = new THREE.Object3D();
const tipObj = new THREE.Object3D();
tipObj.position.set(0, 0, -0.95);
swordAnchor.add(baseObj, tipObj);
let swordDetached = false;

function buildFallbackSword() {
  const g = new THREE.Group();
  const steel = new THREE.MeshStandardMaterial({ color: 0xc9d4e8, metalness: 0.9, roughness: 0.25 });
  const blade = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.05, 0.8), steel);
  blade.position.z = -0.5;
  const guard = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.04, 0.05),
    new THREE.MeshStandardMaterial({ color: 0x8a6b2f, metalness: 0.8, roughness: 0.4 }));
  guard.position.z = -0.08;
  const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.028, 0.22, 12),
    new THREE.MeshStandardMaterial({ color: 0x3a2415, roughness: 0.9 }));
  grip.rotation.x = Math.PI / 2; grip.position.z = 0.05;
  g.add(blade, guard, grip);
  return g;
}
new GLTFLoader().load('./models/sword.glb', (gltf) => {
  const m = gltf.scene;
  const box = new THREE.Box3().setFromObject(m);
  const size = box.getSize(new V()), min = box.min.clone(), center = box.getCenter(new V());
  const s = 0.95 / size.y;
  m.scale.setScalar(s);
  m.position.set(-center.x * s, -min.y * s, -center.z * s);
  const holder = new THREE.Group();
  holder.add(m);
  holder.rotation.x = -Math.PI / 2;
  swordAnchor.add(holder);
  tipObj.position.set(0, 0, -size.y * s);
}, undefined, () => swordAnchor.add(buildFallbackSword()));

// element aura light (used by the Elemental mechanic)
const auraLight = new THREE.PointLight(0xff6600, 0, 2.5);
swordAnchor.add(auraLight);

// ============================================================
// grips — sword rides the fist; re-checked every frame
// ============================================================
const grips = [renderer.xr.getControllerGrip(0), renderer.xr.getControllerGrip(1)];
grips.forEach((g) => {
  g.userData = { connected: false, handedness: '', prev: [] };
  g.addEventListener('connected', (e) => { g.userData.connected = true; g.userData.handedness = e.data.handedness; initAudio(); });
  g.addEventListener('disconnected', () => { g.userData.connected = false; g.userData.handedness = ''; });
  rig.add(g);
});
const wieldEl = document.getElementById('wield');
const DESKTOP_SWORD = { pos: new V(0.25, 1.4, 0.9) };
function ensureSwordHeld() {
  if (swordDetached) return;
  const session = renderer.xr.getSession();
  if (!session) {
    if (swordAnchor.parent !== scene) {
      scene.add(swordAnchor);
      swordAnchor.position.copy(DESKTOP_SWORD.pos);
      swordAnchor.rotation.set(0, 0, 0);
    }
    if (wieldEl.textContent !== '🖥️') wieldEl.textContent = '🖥️';
    return;
  }
  let target = grips.find((g) => g.userData.connected && g.userData.handedness === 'right')
    || grips.find((g) => g.userData.connected);
  if (!target) {
    const srcs = [...session.inputSources];
    let idx = srcs.findIndex((s) => s.handedness === 'right');
    if (idx < 0) idx = srcs.findIndex((s) => s.handedness && s.handedness !== 'none');
    if (idx >= 0 && grips[idx]) target = grips[idx];
  }
  if (target && swordAnchor.parent !== target) {
    target.add(swordAnchor);
    swordAnchor.position.set(0, 0.01, -0.02);
    swordAnchor.rotation.set(0, 0, 0);
    wieldEl.textContent = target.userData.handedness === 'left' ? '🎮L' : '🎮R';
  }
}

// ============================================================
// sword tracking -> shared swordState (used by fight + lab)
// ============================================================
const swordState = {
  tip: new V(), base: new V(), vel: new V(), speed: 0,
  edgeDir: new V(1, 0, 0), align: 0,
};
const _tip = new V(), _base = new V(), _blade = new V(), _vel = new V(), _along = new V(), _ex = new V();
let tipInit = false;
const tipPrev = new V();

// ============================================================
// HUD
// ============================================================
const fbEl = document.getElementById('feedback');
const mechEl = document.getElementById('mech');
const vignette = document.getElementById('vignette');
let fbTimer = 0;
function feedback(text, color = '#fff') {
  fbEl.textContent = text; fbEl.style.color = color; fbEl.style.opacity = 1;
  toast.draw(text, color);
  clearTimeout(fbTimer);
  fbTimer = setTimeout(() => { fbEl.style.opacity = 0; }, 1400);
}

// ============================================================
// FIGHT mode (enemy + hp + swing scoring)
// ============================================================
const ENEMY_Z = -1.05;
const BODY_C = new V(0, 1.32, ENEMY_Z), BODY_R = 0.55;
const CORE_C = new V(0, 1.32, ENEMY_Z + 0.52), CORE_R = 0.26;

const enemy = new THREE.Group();
enemy.position.set(0, 0, ENEMY_Z);
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x5b6b8c, roughness: 0.6, metalness: 0.3 });
const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.42, 0.55, 6, 16), bodyMat);
body.position.y = 1.32;
const head = new THREE.Mesh(new THREE.SphereGeometry(0.26, 24, 18), bodyMat.clone());
head.position.y = 2.0;
const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff3344 });
for (const s of [-1, 1]) {
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.045, 10, 8), eyeMat);
  eye.position.set(0.1 * s, 2.03, 0.22);
  enemy.add(eye);
}
const core = new THREE.Mesh(new THREE.SphereGeometry(CORE_R, 20, 14),
  new THREE.MeshStandardMaterial({ color: 0xffb020, emissive: 0xcc6600, emissiveIntensity: 1.2 }));
core.position.set(0, 1.32, 0.52);
enemy.add(body, head, core);
fightGroup.add(enemy);

const fightLabel = makeBoard(512, 150, 1.25, 0.37);
fightLabel.mesh.position.set(0, 2.62, ENEMY_Z);
fightGroup.add(fightLabel.mesh);

let hp = 100, kills = 0, streak = 0, flailStreak = 0;
let punishUntil = 0, enrageUntil = 0, deadUntil = 0;
let wasOutsideSinceHit = true;
const hpnum = document.getElementById('hpnum');
const hpfill = document.getElementById('hpfill');
const killsEl = document.getElementById('kills');
const streakEl = document.getElementById('streak');

function refreshHud(msg = '', color = '#fff') {
  hpnum.textContent = Math.max(0, Math.round(hp));
  hpfill.style.width = Math.max(0, hp) + '%';
  hpfill.style.background = hp > 50 ? '#4ade80' : hp > 25 ? '#facc15' : '#f87171';
  killsEl.textContent = kills;
  streakEl.textContent = streak;
  fightLabel.draw([`HP ${Math.max(0, Math.round(hp))}`, msg], color);
}
function damage(amount, where, clean, peak) {
  hp -= amount; streak++; flailStreak = 0;
  thud(); pulseHaptics(0.9, 120);
  enemy.position.z = ENEMY_Z + 0.12;
  setTimeout(() => (enemy.position.z = ENEMY_Z), 120);
  bodyMat.emissive = new THREE.Color(0xff2222); bodyMat.emissiveIntensity = 0.9;
  setTimeout(() => (bodyMat.emissiveIntensity = 0), 120);
  feedback(`${clean ? 'CLEAN HIT' : 'hit'} −${Math.round(amount)}${where === 'core' ? ' CORE!' : ''}`, clean ? '#4ade80' : '#facc15');
  if (hp <= 0) { kills++; feedback(`KILL! (${kills})`, '#4ade80'); enemy.rotation.x = -1.2; deadUntil = performance.now() + 2000; hp = 0; }
  refreshHud(clean ? `-${Math.round(amount)} @ ${peak.toFixed(1)} m/s` : 'weak — swing bigger', clean ? '#4ade80' : '#facc15');
}
function punish(reason) {
  flailStreak++; streak = 0; buzz(); pulseHaptics(0.3, 200);
  punishUntil = performance.now() + 600;
  if (flailStreak >= 3) {
    enrageUntil = performance.now() + 2000; flailStreak = 0;
    eyeMat.color.set(0xff00ff);
    setTimeout(() => eyeMat.color.set(0xff3344), 2000);
    feedback('ENRAGED — stop flailing!', '#f87171'); refreshHud('ENRAGED — immune 2s', '#f87171');
  } else { feedback(reason, '#f87171'); refreshHud(reason, '#f87171'); }
}

let swinging = false, swingT0 = 0, lowT0 = 0, path = [], peakPerp = 0, reversals = 0, insideDwell = 0;
const velPrev = new V();
function evaluateSwing(now) {
  const dur = (now - swingT0) / 1000;
  let arc = 0;
  for (let i = 1; i < path.length; i++) arc += path[i].p.distanceTo(path[i - 1].p);
  let hitWhere = null;
  for (let i = 1; i < path.length; i++) {
    if (segHitsSphere(path[i - 1].p, path[i].p, CORE_C, CORE_R + 0.1)) { hitWhere = 'core'; break; }
    if (segHitsSphere(path[i - 1].p, path[i].p, BODY_C, BODY_R)) hitWhere = 'body';
  }
  if (!hitWhere) return;
  if (!wasOutsideSinceHit) return punish('STUCK INSIDE — pull out!');
  if (now < punishUntil || now < enrageUntil || now < deadUntil) return;
  wasOutsideSinceHit = false;
  const flail = reversals >= 4 || (reversals >= 3 && arc < 0.9) || (insideDwell > 0.5 && reversals >= 2);
  if (flail) return punish('FLAIL! 0 dmg — one clean arc');
  const clean = arc >= 0.5 && dur >= 0.12 && dur <= 1.2 && reversals <= 2 && peakPerp >= 2.0;
  whoosh(peakPerp);
  if (clean) {
    const dmg = Math.min(24, 6 + peakPerp * 2.2) * (hitWhere === 'core' ? 1.5 : 1);
    damage(dmg, hitWhere, true, peakPerp);
  } else damage(2 + Math.random() * 2, hitWhere, false, peakPerp);
}
function trackSword(now) {
  tipObj.getWorldPosition(_tip);
  baseObj.getWorldPosition(_base);
  swordState.tip.copy(_tip); swordState.base.copy(_base);
  _blade.subVectors(_tip, _base).normalize();
  swordState.edgeDir.copy(_ex.set(1, 0, 0).transformDirection(swordAnchor.matrixWorld));
  if (!tipInit) { tipPrev.copy(_tip); tipInit = true; return; }
  const step = 1 / 60;
  _vel.subVectors(_tip, tipPrev).divideScalar(step);
  swordState.vel.copy(_vel);
  swordState.speed = _vel.length();
  swordState.align = swordState.speed > 0.01 ? Math.abs(_vel.dot(swordState.edgeDir)) / swordState.speed : 0;

  if (mode !== 'fight') { tipPrev.copy(_tip); return; }
  if (deadUntil && now > deadUntil) { deadUntil = 0; hp = 100; enemy.rotation.x = 0; refreshHud('fresh opponent'); }
  const inside = _tip.distanceTo(BODY_C) < BODY_R + 0.05;
  if (!inside) wasOutsideSinceHit = true;
  // perpendicular speed (edge-leading component)
  _along.copy(_vel).addScaledVector(_blade, -_vel.dot(_blade));
  const perpSpeed = _along.length();
  if (!swinging && perpSpeed > 1.2 && swordState.speed < 14) {
    swinging = true; swingT0 = now; lowT0 = 0;
    path = [{ p: _tip.clone() }]; peakPerp = perpSpeed; reversals = 0; insideDwell = 0;
    velPrev.copy(_vel);
  } else if (swinging) {
    path.push({ p: _tip.clone() });
    peakPerp = Math.max(peakPerp, perpSpeed);
    if (inside) insideDwell += step;
    if (_vel.lengthSq() > 0.04 && velPrev.lengthSq() > 0.04) {
      if (_vel.angleTo(velPrev) > 1.75) reversals++;
      velPrev.copy(_vel);
    }
    if (perpSpeed < 0.7) {
      if (!lowT0) lowT0 = now;
      if (now - lowT0 > 80) { swinging = false; evaluateSwing(now); }
    } else lowT0 = 0;
    if (now - swingT0 > 1500) { swinging = false; evaluateSwing(now); }
  }
  tipPrev.copy(_tip);
}

// ============================================================
// locomotion
// ============================================================
const keys = {};
addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
const _fwd = new V(), _strafe = new V(), _mv = new V();
const ARENA_R = 4.5, MOVE_SPEED = 2.4;
function clampArena() {
  const r = Math.hypot(rig.position.x, rig.position.z);
  if (r > ARENA_R) { rig.position.x *= ARENA_R / r; rig.position.z *= ARENA_R / r; }
}
function locomotion(dt) {
  const session = renderer.xr.getSession();
  if (session) {
    for (const src of session.inputSources) {
      const gp = src.gamepad;
      if (!gp || gp.axes.length < 2) continue;
      const n = gp.axes.length;
      const sx = gp.axes[n - 2], sy = gp.axes[n - 1];
      if (src.handedness === 'left') {
        const mag = Math.hypot(sx, sy);
        if (mag > 0.2) {
          camera.getWorldDirection(_fwd); _fwd.y = 0;
          if (_fwd.lengthSq() < 1e-6) _fwd.set(0, 0, -1); else _fwd.normalize();
          _strafe.set(-_fwd.z, 0, _fwd.x);
          _mv.set(0, 0, 0).addScaledVector(_fwd, -sy).addScaledVector(_strafe, sx).normalize();
          rig.position.addScaledVector(_mv, MOVE_SPEED * dt * Math.min(1, mag));
          clampArena();
        }
      } else if (src.handedness === 'right' && mode === 'fight') {
        if (Math.abs(sx) > 0.2) rig.rotation.y -= sx * 1.8 * dt;
      }
    }
  } else {
    _fwd.set(0, 0, -1).applyQuaternion(camera.quaternion); _fwd.y = 0; _fwd.normalize();
    _strafe.set(-_fwd.z, 0, _fwd.x);
    _mv.set(0, 0, 0);
    if (keys['w'] || keys['arrowup']) _mv.add(_fwd);
    if (keys['s'] || keys['arrowdown']) _mv.sub(_fwd);
    if (keys['d'] || keys['arrowright']) _mv.add(_strafe);
    if (keys['a'] || keys['arrowleft']) _mv.sub(_strafe);
    if (_mv.lengthSq() > 0) { _mv.normalize(); rig.position.addScaledVector(_mv, MOVE_SPEED * dt); clampArena(); }
  }
}

// ============================================================
// quick reload
// ============================================================
let reloadArmed = 0;
function checkReload(now) {
  const session = renderer.xr.getSession();
  if (session) {
    let held = 0;
    for (const src of session.inputSources) {
      const b = src.gamepad?.buttons;
      if (b && (b[1]?.pressed || b[0]?.pressed)) held++;
    }
    if (held >= 2) {
      if (!reloadArmed) { reloadArmed = now; feedback('reloading… keep holding', '#facc15'); }
      else if (now - reloadArmed > 700) location.reload();
      return;
    }
  }
  reloadArmed = 0;
}
addEventListener('keydown', (e) => { if (e.key === 'r' || e.key === 'R') location.reload(); });

// ============================================================
// left-controller buttons (mode toggle)
// ============================================================
function leftButtonsPressed(indexList) {
  const session = renderer.xr.getSession();
  if (!session) return false;
  for (const src of session.inputSources) {
    if (src.handedness !== 'left') continue;
    const b = src.gamepad?.buttons;
    if (!b) continue;
    return indexList.some((i) => b[i]?.pressed);
  }
  return false;
}
// grips get prev-button tracking too (for charge/throw/etc.)
function gripButton(hand, index) {
  const session = renderer.xr.getSession();
  if (!session) return false;
  for (const src of session.inputSources) {
    if (src.handedness !== hand) continue;
    return !!src.gamepad?.buttons?.[index]?.pressed;
  }
  return false;
}

let dragging = false, px = 0, py = 0;
addEventListener('pointerdown', (e) => { dragging = true; px = e.clientX; py = e.clientY; initAudio(); });
addEventListener('pointerup', () => (dragging = false));
addEventListener('pointermove', (e) => {
  if (renderer.xr.isPresenting || !dragging || swordDetached) return;

});

const DUMMY_Z = -1.05;
function makeDummy(x = 0, z = DUMMY_Z, scale = 1, color = 0x5b6b8c) {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.3 });
  const b = new THREE.Mesh(new THREE.CapsuleGeometry(0.42 * scale, 0.55 * scale, 6, 16), mat);
  b.position.y = 1.32 * scale;
  const h = new THREE.Mesh(new THREE.SphereGeometry(0.26 * scale, 20, 16), mat.clone());
  h.position.y = 2.0 * scale;
  g.add(b, h);
  g.position.set(x, 0, z);
  g.userData = { body: b, head: h, mat, scale };
  return g;
}
function dummyBodyCenter(d) { return worldPos(d.userData.body); }
function dummyHeadCenter(d) { return worldPos(d.userData.head); }

let _lastHitT = 0;
function tryBladeHit(d, minSpeed = 2.0, cooldown = 320) {
  const now = performance.now();
  if (now - _lastHitT < cooldown) return null;
  if (swordState.speed < minSpeed) return null;
  const s = d.userData.scale;
  if (!segHitsSphere(swordState.base, swordState.tip, dummyBodyCenter(d), 0.52 * s)
    && !segHitsSphere(swordState.base, swordState.tip, dummyHeadCenter(d), 0.34 * s)) return null;
  _lastHitT = now;
  ding();
  pulseHaptics(0.8, 100);
  return { speed: swordState.speed, align: swordState.align };
}
function flash(d, color = 0xff2222, ms = 130) {
  const m = d.userData.mat;
  m.emissive = new THREE.Color(color); m.emissiveIntensity = 0.9;
  setTimeout(() => (m.emissiveIntensity = 0), ms);
}
function spawnOrb(root, pos, color, r = 0.12) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12),
    new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.9 }));
  m.position.copy(pos);
  root.add(m);
  return m;
}
function offhandPos(out = new V()) {
  const g = grips.find((x) => x.userData.connected && x.userData.handedness === 'left');
  if (g) return g.getWorldPosition(out);
  camera.getWorldPosition(out);
  out.y -= 0.3;
  return out;
}
function cameraWorld(out = new V()) { return camera.getWorldPosition(out); }
function elapsed(t0, now) { return (now - t0) / 1000; }

      const cu = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.7 }));
      const fromLeft = Math.random() < 0.5;
      cu.position.set(fromLeft ? -2 : 2, 1.2 + Math.random() * 0.6, -1.2 - Math.random() * 0.8);
      cu.userData = { v: new V(fromLeft ? 2.4 : -2.4, 0, 0), sliced: false };
      mechRoot.add(cu); this.cubes.push(cu);
    }
    for (let i = this.cubes.length - 1; i >= 0; i--) {
      const cu = this.cubes[i];
      cu.position.addScaledVector(cu.userData.v, dt); cu.rotation.y += dt * 2;
      if (swordState.speed > 2.5) {
        const p = cu.position;
        const mid = swordState.base.clone().lerp(swordState.tip, 0.5);
        if (segHitsSphere(swordState.base, swordState.tip, p, 0.22) || segHitsSphere(swordState.base, swordState.tip, mid, 0.22)) {
          this.slices++; whoosh(6); flashCrate(cu); feedback('SLICE!', '#f87171');
          // two halves
          for (const s of [-1, 1]) {
            const h = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.15, 0.3), cu.material.clone());
            h.position.copy(p); h.position.y += s * 0.09;
            h.userData = { v: new V(cu.userData.v.x * 0.5, s * 1.2, 0), half: true, life: now };
            mechRoot.add(h); this.cubes.push(h);
          }
          mechRoot.remove(cu); disposeObj(cu); this.cubes.splice(i, 1); continue;
        }
      }
      if (cu.userData.half) { cu.userData.v.y -= 6 * dt; cu.position.addScaledVector(cu.userData.v, dt); }
      if (Math.abs(cu.position.x) > 4.5 || cu.position.y < 0) { mechRoot.remove(cu); disposeObj(cu); this.cubes.splice(i, 1); }
    }
    mechEl.textContent = `slices: ${this.slices}`;
  },
});
function flashCrate(o) { const m = o.material; m.emissive = new THREE.Color(0xff6666); m.emissiveIntensity = 0.8; setTimeout(() => (m.emissiveIntensity = 0), 160); }

// 13 — BULLET TIME
MECHANICS.push({
  name: 'Bullet Time', color: '#818cf8',
  tip: 'Blade near the core slows the world.',
  how: ['Bring the tip near the core', 'Time slows, vignette closes in', 'Finish the blow in slow-mo'],
  setup(root) {
    this.d = makeDummy(0, -1.6); root.add(this.d);
    this.d.userData.core = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 12), new THREE.MeshStandardMaterial({ color: 0x818cf8, emissive: 0x4f46e5, emissiveIntensity: 1.3 }));
    this.d.userData.core.position.set(0, 1.32, 0.5); this.d.add(this.d.userData.core);
    this.phase = 0; this.ts = 1; this.slows = 0;
  },
  update(dt, now) {
    const coreC = worldPos(this.d.userData.core);
    const near = swordState.tip.distanceTo(coreC) < 0.5;
    const target = near ? 0.25 : 1;
    this.ts += (target - this.ts) * Math.min(1, dt * 6);
    if (near) this.slows++;
    vignette.style.opacity = near ? 0.85 : 0;
    this.phase += dt * this.ts;
    this.d.rotation.y = Math.sin(this.phase) * 0.6;
    this.d.userData.core.position.x = Math.sin(this.phase * 1.7) * 0.18;
    const hit = tryBladeHit(this.d, 1.6, 300);
    if (hit) { const dmg = near ? 22 : 9; flash(this.d, 0x818cf8, 220); hurtDummy(this.d, dmg); feedback(near ? `SLOW-MO FINISH +${dmg}` : `+${dmg} — try slow-mo`, near ? '#4ade80' : '#facc15'); }
    mechEl.textContent = `time x${this.ts.toFixed(2)}  ·  slow-mo frames: ${this.slows}`;
  },
  teardown() { vignette.style.opacity = 0; },
});

// 14 — ELEMENTAL IMBUE
MECHANICS.push({
  name: 'Elemental Imbue', color: '#fb923c',
  tip: 'Squeeze to change element.',
  how: ['Grid: grip cycles FIRE→ICE→CHAIN', 'Fire = burn over time', 'Ice = freeze · Chain = arcs to 2nd dummy'],
  setup(root) {
    this.d = makeDummy(-0.7, -1.9); this.d2 = makeDummy(0.9, -2.4); root.add(this.d, this.d2);
    this.elems = [
      { name: 'FIRE', color: 0xff6600, aura: 0xff4400 },
      { name: 'ICE', color: 0x66ccff, aura: 0x3399ff },
      { name: 'CHAIN', color: 0xffff66, aura: 0xffff00 },
    ];
    this.i = 0; this.prevGrip = false; this.burn = 0; this.frozen = 0;
  },
  update(dt, now) {
    const g = gripButton('right', 1) || gripButton('right', 2);
    if (g && !this.prevGrip) { this.i = (this.i + 1) % this.elems.length; ding(); }
    this.prevGrip = g;
    const e = this.elems[this.i];
    auraLight.color.setHex(e.aura); auraLight.intensity = 1.2;
    const hit = tryBladeHit(this.d, 2, 320);
    if (hit) {
      let msg = '';
      if (e.name === 'FIRE') { this.burn = now + 2500; msg = 'ignited! burning…'; }
      else if (e.name === 'ICE') { this.frozen = now + 2500; msg = 'frozen! stops moving'; }
      else {
        // chain: arc to second dummy
        const beam = new THREE.Line(new THREE.BufferGeometry().setFromPoints([dummyBodyCenter(this.d), dummyBodyCenter(this.d2)]),
          new THREE.LineBasicMaterial({ color: 0xffff66 }));
        mechRoot.add(beam); setTimeout(() => { mechRoot.remove(beam); disposeObj(beam); }, 130);
        hurtDummy(this.d2, 8); msg = 'chained to 2nd target +8';
      }
      flash(this.d, e.color, 200); hurtDummy(this.d, 10); feedback(`${e.name}: ${msg}`, '#' + e.color.toString(16).padStart(6, '0'));
    }
    this.d.userData.mat.color.setHex(this.frozen > now ? 0x88ccff : 0x5b6b8c);
    this.d2.userData.mat.color.setHex(this.frozen > now ? 0x88ccff : 0x5b6b8c);
    if (this.burn > now && Math.random() < dt * 3) { hurtDummy(this.d, 1); flash(this.d, 0xff6600, 100); }
    mechEl.textContent = `element: ${e.name}  ·  grip to cycle`;
  },
  teardown() { auraLight.intensity = 0; },
});

// 15 — SHIELD BREAK
MECHANICS.push({
  name: 'Shield Break', color: '#22d3ee',
  tip: 'A full-power swing shatters the shield.',
  how: ['Shielded: normal hits clang (0 dmg)', 'One huge swing (>7 m/s) breaks it', '3s window of full damage'],
  setup(root) {
    this.d = makeDummy(0, -1.8); root.add(this.d);
    this.shield = new THREE.Mesh(new THREE.SphereGeometry(0.85, 24, 18),
      new THREE.MeshStandardMaterial({ color: 0x22d3ee, transparent: true, opacity: 0.28, emissive: 0x0891b2, emissiveIntensity: 0.6 }));
    this.shield.position.y = 1.2; root.add(this.shield);
    this.broken = 0; this.blocked = 0;
  },
  update(dt, now) {
    const up = this.broken < now;
    this.shield.visible = up;
    if (up) this.shield.material.opacity = 0.22 + 0.12 * Math.sin(now * 0.006);
    const hit = tryBladeHit(this.d, 1.6, 300);
    if (hit) {
      if (up) {
        if (hit.speed > 7) { this.broken = now + 3000; flash(this.d, 0x22d3ee, 300); zap(); feedback('SHIELD BROKEN — 3s window!', '#4ade80'); }
        else { this.blocked++; buzz(); pulseHaptics(0.4, 120); feedback('clang! swing harder', '#f87171'); }
      } else { flash(this.d, 0x4ade80, 250); hurtDummy(this.d, 14); feedback('full damage +14', '#4ade80'); }
    }
    mechEl.textContent = up ? `shielded (${this.blocked} clangs) — one big swing` : 'window open — hit now!';
  },
});

// dummy hit points (lab-only, respawns)
function hurtDummy(d, dmg) {
  d.userData.hp = (d.userData.hp ?? 100) - dmg;
  if (d.userData.hp <= 0) { d.userData.hp = 100; d.rotation.x = -1.3; thud(); setTimeout(() => (d.rotation.x = 0), 900); }
}

// ============================================================
// mode + lab management
// ============================================================
let mode = 'fight';
let labIndex = 0;
let activeMech = null;
const modeBtn = document.getElementById('modeBtn');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const mechNo = document.getElementById('mechNo');
const fightStats = document.getElementById('fightStats');
const labBoard = makeBoard(720, 300, 1.5, 0.62);
labBoard.mesh.position.set(0, 2.35, DUMMY_Z + 0.4);
labGroup.add(labBoard.mesh);

function clearMech() {
  try { activeMech?.teardown?.(); } catch (e) { console.warn(e); }
  while (mechRoot.children.length) {
    const c = mechRoot.children.pop();
    mechRoot.remove(c); disposeObj(c);
  }
  activeMech = null;
}
function loadMech(i) {
  clearMech();
  labIndex = (i + MECHANICS.length) % MECHANICS.length;
  const m = MECHANICS[labIndex];
  activeMech = m;
  try { m.setup?.(mechRoot); } catch (e) { console.warn(e); }
  labBoard.draw([`${labIndex + 1}/${MECHANICS.length}  ${m.name}`, m.tip, ...(m.how || [])], m.color);
  mechNo.textContent = `${labIndex + 1}/${MECHANICS.length}`;
}
function setMode(m) {
  mode = m;
  fightGroup.visible = m === 'fight';
  labGroup.visible = m === 'lab';
  fightStats.style.display = m === 'fight' ? '' : 'none';
  prevBtn.style.display = nextBtn.style.display = mechNo.style.display = m === 'lab' ? '' : 'none';
  modeBtn.textContent = m === 'fight' ? '🎛️ Lab' : '⚔️ Fight';
  rig.position.set(0, 0, 0); rig.rotation.set(0, 0, 0);
  camera.position.set(0, 1.6, 0);
  if (m === 'lab') { loadMech(labIndex); mechEl.textContent = ''; }
  else { clearMech(); mechEl.textContent = ''; toast.draw('FIGHT — swing clean', '#4ade80'); }
}
modeBtn.onclick = () => setMode(mode === 'fight' ? 'lab' : 'fight');
prevBtn.onclick = () => loadMech(labIndex - 1);
nextBtn.onclick = () => loadMech(labIndex + 1);
addEventListener('keydown', (e) => {
  if (e.key === 'l' || e.key === 'L') setMode(mode === 'fight' ? 'lab' : 'fight');
  if (e.key === '[') loadMech(labIndex - 1);
  if (e.key === ']') loadMech(labIndex + 1);
});

// right stick in lab cycles mechanics; left-controller buttons toggle mode
let labStickArmed = true, modeBtnPrev = false;
function labInput() {
  const session = renderer.xr.getSession();
  if (!session) return;
  // mode toggle: left controller stick-press / A-B buttons
  const pressed = leftButtonsPressed([3, 4, 5, 8]);
  if (pressed && !modeBtnPrev) setMode(mode === 'fight' ? 'lab' : 'fight');
  modeBtnPrev = pressed;
  if (mode !== 'lab') return;
  for (const src of session.inputSources) {
    if (src.handedness !== 'right') continue;
    const a = src.gamepad?.axes;
    if (!a || a.length < 2) continue;
    const sx = a[a.length - 2];
    if (Math.abs(sx) > 0.75 && labStickArmed) { loadMech(labIndex + Math.sign(sx)); labStickArmed = false; }
    else if (Math.abs(sx) < 0.3) labStickArmed = true;
  }
}

// ============================================================
// loop
// ============================================================
refreshHud('swing to fight');
setMode('fight');
let lastT = performance.now();
renderer.setAnimationLoop(() => {
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastT) / 1000);
  lastT = now;
  locomotion(dt);
  labInput();
  ensureSwordHeld();
  trackSword(now);
  checkReload(now);
  if (mode === 'lab' && activeMech) { try { activeMech.update(dt, now); } catch (e) { console.warn(e); } }
  renderer.render(scene, camera);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
