<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>vr_game — Cadence</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a0f; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 14px; align-items: center; z-index: 10;
    background: rgba(0,0,0,.7); color: #fff; padding: 8px 18px;
    border-radius: 999px; font-weight: 700; user-select: none; white-space: nowrap; font-size: 14px;
  }
  #beatdot { width: 12px; height: 12px; border-radius: 50%; background: #4ade80; transition: none; }
  #hpbar { display: inline-block; vertical-align: middle; width: 90px; height: 8px; background: #333; border-radius: 4px; overflow: hidden; }
  #hpfill { display: block; height: 100%; width: 100%; background: #4ade80; }
  #cadbar { display: inline-block; vertical-align: middle; width: 110px; height: 8px; background: #333; border-radius: 4px; overflow: hidden; }
  #cadfill { display: block; height: 100%; width: 0%; background: #38bdf8; }
  #feedback {
    position: fixed; top: 56px; left: 50%; transform: translateX(-50%);
    font-weight: 800; font-size: 19px; z-index: 10; opacity: 0;
    transition: opacity .2s; text-shadow: 0 2px 12px #000; pointer-events: none; text-align: center;
  }
  #combo {
    position: fixed; top: 88px; left: 50%; transform: translateX(-50%);
    z-index: 10; font-weight: 900; font-size: 30px; color: #facc15;
    text-shadow: 0 2px 14px #000; opacity: .25; transition: opacity .15s;
  }
  #help {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    color: #9a9ab0; font-size: 12px; z-index: 10; text-align: center;
    background: rgba(0,0,0,.6); padding: 6px 16px; border-radius: 8px; max-width: 94vw; line-height: 1.5;
  }
  #help b { color: #e8e8ef; }
  #vignette {
    position: fixed; inset: 0; z-index: 5; pointer-events: none; opacity: 0;
    transition: opacity .2s; background: radial-gradient(circle, transparent 40%, rgba(120,20,20,.7) 100%);
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud">
  <span id="beatdot"></span>
  <span>❤️ <span id="hpbar"><span id="hpfill"></span></span></span>
  <span>⚡ <span id="cadbar"><span id="cadfill"></span></span></span>
  <span id="elem">🔥 Fire</span>
  <span>⚔️ <span id="kills">0</span></span>
</div>
<div id="feedback"></div>
<div id="combo"></div>
<div id="vignette"></div>
<div id="help">
  <b>Stay on the beat.</b> On-beat hits build <b>Cadence ⚡</b> and combo · heavy on-beat swing spends ⚡ for a <b>beam</b><br>
  off-hand <b>trigger = pull</b>, <b>grip = push</b> (interrupts) · <b>right grip = cycle element</b> · both grips 1s = reload<br>
  desktop: WASD · drag to swing · <b>E</b> element · <b>Q</b> pull · <b>F</b> push
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRButton } from 'three/addons/webxr/VRButton.js';

// ============================================================
// tuning
// ============================================================
const BPM = 96;
const BEAT = 60 / BPM;          // seconds per beat (~0.625)
const ONBEAT = 0.14;            // +/- seconds counted as "on beat"
const CAD_MAX = 100;
const CAD_DECAY = 5;            // per second
const COST = { beam: 25, force: 15, elem: 10 };
const GAIN = { melee: 14, beam: 10, force: 6 };
const MELEE_DMG = 11, BEAM_DMG = 17;
const ENEMY_HP = 42, ENEMY_DMG = 10, REACH = 1.7;
const WARMUP_BEATS = 4;
const ELEMENTS = [
  { id: 'fire', name: '🔥 Fire', color: 0xff6600, hex: '#fb923c' },
  { id: 'ice', name: '❄️ Ice', color: 0x66ccff, hex: '#7dd3fc' },
  { id: 'chain', name: '⚡ Chain', color: 0xffff66, hex: '#fde047' },
];

// ============================================================
// renderer / scene
// ============================================================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);
scene.fog = new THREE.Fog(0x0a0a0f, 8, 22);

const rig = new THREE.Group();
scene.add(rig);
const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.04, 60);
camera.position.set(0, 1.6, 0);
rig.add(camera);

scene.add(new THREE.HemisphereLight(0x8899ff, 0x221122, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.35);
sun.position.set(3, 6, 2);
scene.add(sun);

const ground = new THREE.Mesh(new THREE.CircleGeometry(11, 48), new THREE.MeshStandardMaterial({ color: 0x14141d, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
scene.add(new THREE.GridHelper(22, 44, 0x444466, 0x262633));

// ============================================================
// helpers
// ============================================================
const V = THREE.Vector3;
function segHitsSphere(a, b, c, r) {
  const ab = new V().subVectors(b, a);
  const t = THREE.MathUtils.clamp(new V().subVectors(c, a).dot(ab) / (ab.lengthSq() || 1e-6), 0, 1);
  return new V().copy(a).addScaledVector(ab, t).distanceTo(c) <= r;
}
function worldPos(o, out = new V()) { return o.getWorldPosition(out); }
function disposeObj(o) {
  o.traverse?.((n) => { n.geometry?.dispose?.(); if (Array.isArray(n.material)) n.material.forEach((m) => m.dispose?.()); else n.material?.dispose?.(); });
}
function makeBoard(w, h, worldW, worldH) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  const tex = new THREE.CanvasTexture(cv);
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(worldW, worldH), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));
  function draw(lines, color = '#fff') {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(0,0,0,.72)'; ctx.fillRect(4, 4, w - 8, h - 8);
    ctx.textAlign = 'center';
    const arr = Array.isArray(lines) ? lines : [lines];
    const lh = h / (arr.length + 0.6);
    arr.forEach((ln, i) => {
      ctx.fillStyle = i === 0 ? color : '#cfcfe0';
      ctx.font = `bold ${i === 0 ? Math.round(lh * 0.6) : Math.round(lh * 0.46)}px system-ui, sans-serif`;
      ctx.fillText(ln, w / 2, lh * (i + 0.85), w - 24);
    });
    tex.needsUpdate = true;
  }
  return { mesh, draw, tex, canvas: cv, ctx };
}
const hud3d = new THREE.Group();
hud3d.position.set(0, -0.19, -0.75);
camera.add(hud3d);
const toast = makeBoard(640, 128, 0.62, 0.124);
hud3d.add(toast.mesh);

// ============================================================
// audio
// ============================================================
let AC = null;
function initAudio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } }
function tone(type, f0, f1, dur, vol, when = 0) {
  if (!AC) return;
  const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur + 0.02);
  o.connect(g).connect(AC.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
const tickSfx = (down) => { tone('sine', down ? 1100 : 820, down ? 900 : 700, 0.05, down ? 0.05 : 0.025); };
const hitSfx = () => tone('sine', 160, 55, 0.14, 0.2);
const missSfx = () => tone('square', 160, 90, 0.1, 0.06);
const beamSfx = () => tone('sawtooth', 700, 180, 0.22, 0.09);
const forceSfx = () => tone('triangle', 320, 620, 0.16, 0.1);
const elemSfx = () => tone('triangle', 700, 1200, 0.1, 0.08);
const dieSfx = () => tone('sawtooth', 300, 60, 0.5, 0.14);
function pulseHaptics(intensity, ms) {
  try {
    const gp = [...navigator.getGamepads()].find((g) => g && g.hapticActuators?.length);
    gp?.hapticActuators[0].pulse(intensity, ms);
  } catch {}
}

// ============================================================
// sword rig
// ============================================================
const swordAnchor = new THREE.Group();
swordAnchor.position.set(0.25, 1.4, 0.9);
scene.add(swordAnchor);
const baseObj = new THREE.Object3D();
const tipObj = new THREE.Object3D();
tipObj.position.set(0, 0, -0.95);
swordAnchor.add(baseObj, tipObj);
const DESKTOP_SWORD = new V(0.25, 1.4, 0.9);

function buildFallbackSword() {
  const g = new THREE.Group();
  const steel = new THREE.MeshStandardMaterial({ color: 0xc9d4e8, metalness: 0.9, roughness: 0.25 });
  const blade = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.05, 0.8), steel); blade.position.z = -0.5;
  const guard = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.04, 0.05), new THREE.MeshStandardMaterial({ color: 0x8a6b2f, metalness: 0.8, roughness: 0.4 })); guard.position.z = -0.08;
  const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.028, 0.22, 12), new THREE.MeshStandardMaterial({ color: 0x3a2415, roughness: 0.9 }));
  grip.rotation.x = Math.PI / 2; grip.position.z = 0.05;
  g.add(blade, guard, grip); return g;
}
new GLTFLoader().load('./models/sword.glb', (gltf) => {
  const m = gltf.scene;
  const box = new THREE.Box3().setFromObject(m);
  const size = box.getSize(new V()), min = box.min.clone(), center = box.getCenter(new V());
  const s = 0.95 / size.y;
  m.scale.setScalar(s);
  m.position.set(-center.x * s, -min.y * s, -center.z * s);
  const holder = new THREE.Group(); holder.add(m); holder.rotation.x = -Math.PI / 2;
  swordAnchor.add(holder);
  tipObj.position.set(0, 0, -size.y * s);
}, undefined, () => swordAnchor.add(buildFallbackSword()));

const auraLight = new THREE.PointLight(0xff6600, 1.1, 2.6);
swordAnchor.add(auraLight);

// grips — sword rides the fist
const grips = [renderer.xr.getControllerGrip(0), renderer.xr.getControllerGrip(1)];
grips.forEach((g) => {
  g.userData = { connected: false, handedness: '' };
  g.addEventListener('connected', (e) => { g.userData.connected = true; g.userData.handedness = e.data.handedness; initAudio(); });
  g.addEventListener('disconnected', () => { g.userData.connected = false; g.userData.handedness = ''; });
  rig.add(g);
});
function ensureSwordHeld() {
  const session = renderer.xr.getSession();
  if (!session) {
    if (swordAnchor.parent !== scene) { scene.add(swordAnchor); swordAnchor.position.copy(DESKTOP_SWORD); swordAnchor.rotation.set(0, 0, 0); }
    return;
  }
  let target = grips.find((g) => g.userData.connected && g.userData.handedness === 'right') || grips.find((g) => g.userData.connected);
  if (!target) {
    const srcs = [...session.inputSources];
    let idx = srcs.findIndex((s) => s.handedness === 'right');
    if (idx < 0) idx = srcs.findIndex((s) => s.handedness && s.handedness !== 'none');
    if (idx >= 0 && grips[idx]) target = grips[idx];
  }
  if (target && swordAnchor.parent !== target) { target.add(swordAnchor); swordAnchor.position.set(0, 0.01, -0.02); swordAnchor.rotation.set(0, 0, 0); }
}
function gripButton(hand, index) {
  const session = renderer.xr.getSession(); if (!session) return false;
  for (const src of session.inputSources) { if (src.handedness === hand) return !!src.gamepad?.buttons?.[index]?.pressed; }
  return false;
}
function offhandPos(out = new V()) {
  const g = grips.find((x) => x.userData.connected && x.userData.handedness === 'left');
  if (g) return g.getWorldPosition(out);
  camera.getWorldPosition(out); out.y -= 0.3; return out;
}

// sword tracking
const swordState = { tip: new V(), base: new V(), vel: new V(), speed: 0 };
const _tip = new V(), _base = new V(), _blade = new V(), _vel = new V();
const tipPrev = new V(); let tipInit = false;
function trackSword() {
  tipObj.getWorldPosition(_tip); baseObj.getWorldPosition(_base);
  swordState.tip.copy(_tip); swordState.base.copy(_base);
  _blade.subVectors(_tip, _base).normalize();
  if (!tipInit) { tipPrev.copy(_tip); tipInit = true; return; }
  _vel.subVectors(_tip, tipPrev).divideScalar(1 / 60);
  swordState.vel.copy(_vel); swordState.speed = _vel.length();
  tipPrev.copy(_tip);
}

// ============================================================
// beat engine
// ============================================================
let beatClock = 0, beatCount = 0, beatPulse = 0, started = false;
function beatOffset() { return Math.min(beatClock, BEAT - beatClock); }
function isOnBeat() { return beatOffset() <= ONBEAT; }
const beatdot = document.getElementById('beatdot');
const beatRing = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.035, 10, 40), new THREE.MeshBasicMaterial({ color: 0x4ade80, transparent: true, opacity: 0.5 }));
beatRing.position.set(0, 1.5, -1.9);
scene.add(beatRing);

function onBeat() {
  beatCount++;
  const down = beatCount % 4 === 0;
  tickSfx(down);
  beatPulse = 1;
  if (beatCount >= WARMUP_BEATS && beatCount % 4 === 0 && enemies.length < 3) spawnEnemy();
  for (const e of enemies.slice()) enemyOnBeat(e, down);
  // burn ticks
  for (const e of enemies.slice()) if (e.burning) damageEnemy(e, 3, { silent: true, noCombo: true });
}

// ============================================================
// cadence / combo / element
// ============================================================
let cadence = 40, combo = 0, elemIndex = 0; // start with some ⚡ so the verbs are usable immediately
let kills = 0, hp = 100;
const cadfill = document.getElementById('cadfill');
const hpfill = document.getElementById('hpfill');
const killsEl = document.getElementById('kills');
const elemEl = document.getElementById('elem');
const comboEl = document.getElementById('combo');
const fbEl = document.getElementById('feedback');
const vignette = document.getElementById('vignette');
let fbTimer = 0;
function feedback(text, color = '#fff') {
  fbEl.textContent = text; fbEl.style.color = color; fbEl.style.opacity = 1;
  toast.draw(text, color);
  clearTimeout(fbTimer); fbTimer = setTimeout(() => (fbEl.style.opacity = 0), 1300);
}
function comboMult() { return 1 + Math.min(combo, 12) * 0.12; }
function spend(n) { if (cadence < n) { shake(); return false; } cadence -= n; return true; }
function shake() { vignette.style.opacity = 0.5; setTimeout(() => (vignette.style.opacity = 0), 120); }
function refreshHud() {
  cadfill.style.width = Math.min(100, cadence) + '%';
  hpfill.style.width = Math.max(0, hp) + '%';
  hpfill.style.background = hp > 50 ? '#4ade80' : hp > 25 ? '#facc15' : '#f87171';
  killsEl.textContent = kills;
  elemEl.textContent = ELEMENTS[elemIndex].name;
  comboEl.textContent = combo > 1 ? `x${combo}` : '';
  comboEl.style.opacity = combo > 1 ? Math.min(0.35 + combo * 0.08, 1) : 0.25;
}
function resetCombo(why) { if (combo > 2) feedback(`${why} — combo lost`, '#f87171'); combo = 0; }

// ============================================================
// enemies (rhythmic)
// ============================================================
const enemies = [];
function makeEnemyMesh() {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0x5b6b8c, roughness: 0.6, metalness: 0.3 });
  const b = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 0.55, 6, 16), mat); b.position.y = 1.25;
  const h = new THREE.Mesh(new THREE.SphereGeometry(0.25, 20, 16), mat.clone()); h.position.y = 1.95;
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.5, 0.62, 32), new THREE.MeshBasicMaterial({ color: 0xff4444, transparent: true, opacity: 0, side: THREE.DoubleSide }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.03;
  g.add(b, h, ring);
  g.userData = { mat, head: h, ring, hp: ENEMY_HP, state: 'idle', actAt: beatCount + 3, teleUntil: 0, strikeUntil: 0, burning: false, burnUntil: 0, frozenUntil: 0, alive: true };
  return g;
}
function spawnEnemy() {
  const g = makeEnemyMesh();
  const x = (Math.random() - 0.5) * 3.2;
  g.position.set(x, 0, -3.4);
  scene.add(g);
  g.userData.actAt = beatCount + 3 + Math.floor(Math.random() * 2);
  enemies.push(g);
}
function enemyOnBeat(e, down) {
  const u = e.userData;
  if (u.frozenUntil > beatCount) return;
  if (u.state === 'idle') {
    if (beatCount >= u.actAt) { u.state = 'telegraph'; u.teleUntil = beatCount + 1; }
  } else if (u.state === 'telegraph') {
    if (beatCount >= u.teleUntil) { u.state = 'strike'; u.strikeUntil = beatCount + 1; doStrike(e); }
  } else if (u.state === 'strike') {
    if (beatCount >= u.strikeUntil) { u.state = 'idle'; u.actAt = beatCount + 2 + Math.floor(Math.random() * 2); }
  }
}
function doStrike(e) {
  const cam = worldPos(camera);
  const d = Math.hypot(cam.x - e.position.x, cam.z - e.position.z);
  if (d < REACH) {
    hp -= ENEMY_DMG; resetCombo('hit'); missSfx(); pulseHaptics(1, 200); shake();
    feedback(`struck −${ENEMY_DMG} HP`, '#f87171');
    if (hp <= 0) { hp = 0; dieSfx(); feedback('DOWN — recovering…', '#f87171'); setTimeout(respawn, 2500); }
  } else {
    feedback('attack whiffed — keep moving', '#9a9ab0');
  }
}
function respawn() { hp = 100; combo = 0; cadence = 0; }
function damageEnemy(e, dmg, opts = {}) {
  if (!e.userData.alive) return;
  e.userData.hp -= dmg;
  if (!opts.silent) { hitSfx(); pulseHaptics(0.8, 90); }
  e.userData.mat.emissive = new THREE.Color(0xff3333); e.userData.mat.emissiveIntensity = 0.8;
  setTimeout(() => (e.userData.mat.emissiveIntensity = 0), 120);
  if (e.userData.hp <= 0) {
    e.userData.alive = false;
    kills++;
    dieSfx();
    scene.remove(e); disposeObj(e);
    const i = enemies.indexOf(e); if (i >= 0) enemies.splice(i, 1);
    feedback(`KILL (${kills})`, '#4ade80');
  }
}
function nearestEnemy(from, max = 99) {
  let best = null, bd = max;
  for (const e of enemies) { const d = e.position.distanceTo(from); if (d < bd) { bd = d; best = e; } }
  return best;
}

// ============================================================
// element application
// ============================================================
function applyElement(e, dmg) {
  const el = ELEMENTS[elemIndex];
  auraLight.color.setHex(el.color);
  if (el.id === 'fire') { e.userData.burning = true; e.userData.burnUntil = performance.now() + 3000; }
  else if (el.id === 'ice') { e.userData.frozenUntil = beatCount + 2; }
  else if (el.id === 'chain') {
    const other = enemies.find((o) => o !== e && o.position.distanceTo(e.position) < 3.2);
    if (other) {
      const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([worldPos(e), worldPos(other)]), new THREE.LineBasicMaterial({ color: 0xffff66 }));
      scene.add(line); setTimeout(() => { scene.remove(line); disposeObj(line); }, 130);
      damageEnemy(other, dmg * 0.5, { silent: true });
    }
  }
}
function cycleElement() {
  if (!spend(COST.elem)) { feedback('need ⚡ to change element', '#f87171'); return; }
  elemIndex = (elemIndex + 1) % ELEMENTS.length;
  elemSfx();
  auraLight.color.setHex(ELEMENTS[elemIndex].color);
  feedback(`element: ${ELEMENTS[elemIndex].name}`, ELEMENTS[elemIndex].hex);
}

// ============================================================
// verbs
// ============================================================
let meleeCd = 0, beamCd = 0, beamArmed = true;

function meleeHit(e, onBeat) {
  const mult = comboMult();
  let dmg = MELEE_DMG * mult;
  if (!onBeat) dmg *= 0.3;
  damageEnemy(e, dmg);
  applyElement(e, dmg);
  // knockback
  const dir = new V().subVectors(e.position, worldPos(camera)).setY(0).normalize();
  e.position.addScaledVector(dir, onBeat ? 0.35 : 0.12);
  if (onBeat) {
    cadence = Math.min(CAD_MAX, cadence + GAIN.melee);
    combo++;
    // interrupt telegraphs on beat
    if (e.userData.state === 'telegraph') {
      e.userData.state = 'idle'; e.userData.actAt = beatCount + 2;
      feedback(`INTERRUPTED · +${Math.round(dmg)}`, '#4ade80');
    } else {
      feedback(`ON BEAT +${Math.round(dmg)} · x${combo}`, '#4ade80');
    }
  } else {
    resetCombo('off-beat');
    feedback(`off-beat +${Math.round(dmg)}`, '#facc15');
  }
}

function tryMelee(now) {
  if (now < meleeCd || swordState.speed < 2.2) return;
  for (const e of enemies) {
    const center = worldPos(e).setY(1.25);
    const headC = worldPos(e.userData.head);
    if (segHitsSphere(swordState.base, swordState.tip, center, 0.5) || segHitsSphere(swordState.base, swordState.tip, headC, 0.34)) {
      meleeCd = now + 300;
      meleeHit(e, isOnBeat());
      return;
    }
  }
}

function tryBeam(now) {
  if (now < beamCd) return;
  if (swordState.speed < 5.8) { beamArmed = true; return; }
  if (!beamArmed) return;
  if (!isOnBeat()) { beamArmed = false; return; } // heavy off-beat swing = just a cut
  if (cadence < COST.beam) { beamArmed = false; feedback('need ⚡25 for a beam', '#f87171'); return; }
  beamArmed = false; beamCd = now + 700;
  cadence -= COST.beam;
  beamSfx(); pulseHaptics(0.9, 110);
  cadence = Math.min(CAD_MAX, cadence + GAIN.beam);
  const w = new THREE.Mesh(new THREE.TorusGeometry(0.36, 0.05, 6, 22, Math.PI), new THREE.MeshBasicMaterial({ color: ELEMENTS[elemIndex].color }));
  w.position.copy(swordState.tip);
  const dir = worldPos(camera).setY(1.2).sub(swordState.tip).setY(0).normalize().negate();
  w.lookAt(worldPos(camera));
  w.userData = { v: dir.clone().multiplyScalar(-9), dmg: BEAM_DMG * comboMult() };
  scene.add(w); beams.push(w);
  feedback(`BEAM ⚡ ${ELEMENTS[elemIndex].name}`, ELEMENTS[elemIndex].hex);
}
const beams = [];
function updateBeams(dt) {
  for (let i = beams.length - 1; i >= 0; i--) {
    const w = beams[i];
    w.position.addScaledVector(w.userData.v, dt);
    w.scale.addScalar(dt * 1.6);
    let done = w.position.length() > 16;
    if (!done) {
      for (const e of enemies) {
        if (segHitsSphere(w.position, w.position, worldPos(e).setY(1.25), 0.55)) {
          damageEnemy(e, w.userData.dmg); applyElement(e, w.userData.dmg);
          if (isOnBeat()) { combo++; cadence = Math.min(CAD_MAX, cadence + 6); }
          done = true; break;
        }
      }
    }
    if (done) { scene.remove(w); disposeObj(w); beams.splice(i, 1); }
  }
}

// force: off-hand trigger = pull, grip = push
let prevPull = false, prevPush = false;
function doPull() {
  const onBeat = isOnBeat();
  if (!spend(COST.force)) { feedback('need ⚡ to pull', '#f87171'); return; }
  forceSfx(); pulseHaptics(0.6, 90);
  const off = offhandPos();
  spawnForceRing(off, 0x38bdf8, false);
  const e = nearestEnemy(off, 6);
  if (e) {
    const dir = new V().subVectors(worldPos(camera), e.position).setY(0).normalize();
    e.position.addScaledVector(dir, onBeat ? 1.5 : 0.8);
    if (onBeat) { e.userData.state = 'idle'; e.userData.actAt = beatCount + 2; cadence = Math.min(CAD_MAX, cadence + GAIN.force); feedback('PULL on beat — staggered', '#38bdf8'); }
    else feedback('pulled', '#38bdf8');
  } else feedback('nothing to pull', '#9a9ab0');
}
function doPush() {
  const onBeat = isOnBeat();
  if (!spend(COST.force)) { feedback('need ⚡ to push', '#f87171'); return; }
  forceSfx(); pulseHaptics(0.6, 90);
  const off = offhandPos();
  spawnForceRing(off, 0xf97316, true);
  const e = nearestEnemy(off, 3.2);
  if (e) {
    const dir = new V().subVectors(e.position, off).setY(0).normalize();
    e.position.addScaledVector(dir, onBeat ? 1.8 : 0.9);
    if (onBeat) {
      e.userData.state = 'idle'; e.userData.actAt = beatCount + 2;
      e.userData.frozenUntil = Math.max(e.userData.frozenUntil, beatCount + 1); // brief stagger
      cadence = Math.min(CAD_MAX, cadence + GAIN.force);
      feedback('PUSH on beat — interrupted', '#4ade80');
    } else feedback('pushed', '#f97316');
  } else feedback('nothing in range', '#9a9ab0');
}
const forceRings = [];
function spawnForceRing(pos, color, outward) {
  const r = new THREE.Mesh(new THREE.TorusGeometry(0.18, 0.03, 8, 28), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9 }));
  r.position.copy(pos); r.lookAt(worldPos(camera));
  r.userData = { t: 0, outward };
  scene.add(r); forceRings.push(r);
}
function updateForceRings(dt) {
  for (let i = forceRings.length - 1; i >= 0; i--) {
    const r = forceRings[i]; r.userData.t += dt;
    const k = r.userData.t / 0.35;
    const s = r.userData.outward ? 1 + k * 5 : 5 - k * 4.5;
    r.scale.setScalar(Math.max(0.1, s)); r.material.opacity = Math.max(0, 0.9 - k);
    if (k >= 1) { scene.remove(r); disposeObj(r); forceRings.splice(i, 1); }
  }
}

// ============================================================
// locomotion
// ============================================================
const keys = {};
addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
const _fwd = new V(), _strafe = new V(), _mv = new V();
const ARENA_R = 5, MOVE_SPEED = 2.4;
function clampArena() { const r = Math.hypot(rig.position.x, rig.position.z); if (r > ARENA_R) { rig.position.x *= ARENA_R / r; rig.position.z *= ARENA_R / r; } }
function locomotion(dt) {
  const session = renderer.xr.getSession();
  if (session) {
    for (const src of session.inputSources) {
      const gp = src.gamepad; if (!gp || gp.axes.length < 2) continue;
      const n = gp.axes.length, sx = gp.axes[n - 2], sy = gp.axes[n - 1];
      if (src.handedness === 'left') {
        const mag = Math.hypot(sx, sy);
        if (mag > 0.2) {
          camera.getWorldDirection(_fwd); _fwd.y = 0;
          if (_fwd.lengthSq() < 1e-6) _fwd.set(0, 0, -1); else _fwd.normalize();
          _strafe.set(-_fwd.z, 0, _fwd.x);
          _mv.set(0, 0, 0).addScaledVector(_fwd, -sy).addScaledVector(_strafe, sx).normalize();
          rig.position.addScaledVector(_mv, MOVE_SPEED * dt * Math.min(1, mag)); clampArena();
        }
      } else if (src.handedness === 'right') {
        if (Math.abs(sx) > 0.2) rig.rotation.y -= sx * 1.8 * dt;
      }
    }
  } else {
    _fwd.set(0, 0, -1).applyQuaternion(camera.quaternion); _fwd.y = 0; _fwd.normalize();
    _strafe.set(-_fwd.z, 0, _fwd.x);
    _mv.set(0, 0, 0);
    if (keys['w'] || keys['arrowup']) _mv.add(_fwd);
    if (keys['s'] || keys['arrowdown']) _mv.sub(_fwd);
    if (keys['d'] || keys['arrowright']) _mv.add(_strafe);
    if (keys['a'] || keys['arrowleft']) _mv.sub(_strafe);
    if (_mv.lengthSq() > 0) { _mv.normalize(); rig.position.addScaledVector(_mv, MOVE_SPEED * dt); clampArena(); }
  }
}

// ============================================================
// input: reload, element, force
// ============================================================
let reloadArmed = 0;
function checkReload(now) {
  const session = renderer.xr.getSession();
  if (session) {
    let held = 0;
    for (const src of session.inputSources) { const b = src.gamepad?.buttons; if (b && (b[1]?.pressed || b[0]?.pressed)) held++; }
    if (held >= 2) { if (!reloadArmed) { reloadArmed = now; feedback('reloading… keep holding', '#facc15'); } else if (now - reloadArmed > 700) location.reload(); return; }
  }
  reloadArmed = 0;
}
addEventListener('keydown', (e) => { if (e.key === 'r' || e.key === 'R') location.reload(); });
addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'e') cycleElement();
  if (k === 'q') doPull();
  if (k === 'f') doPush();
  if (k === ' ') initAudio();
});
let prevElemBtn = false;
function handleVerbs(now) {
  const session = renderer.xr.getSession();
  if (!session) return;
  const leftGrip = gripButton('left', 1) || gripButton('left', 2);
  const rightGrip = gripButton('right', 1) || gripButton('right', 2);
  const leftTrig = gripButton('left', 0);
  // element: right grip tap, but not while both grips held (that's reload)
  if (rightGrip && !prevElemBtn && !leftGrip) cycleElement();
  prevElemBtn = rightGrip;
  // force
  if (leftTrig && !prevPull) doPull();
  if (leftGrip && !prevPush) doPush();
  prevPull = leftTrig; prevPush = leftGrip;
}

// ============================================================
// desktop mouse swing
// ============================================================
let dragging = false, px = 0, py = 0;
addEventListener('pointerdown', (e) => { dragging = true; px = e.clientX; py = e.clientY; initAudio(); });
addEventListener('pointerup', () => (dragging = false));
addEventListener('pointermove', (e) => {
  if (renderer.xr.isPresenting || !dragging) return;
  const dx = (e.clientX - px) / innerHeight, dy = (e.clientY - py) / innerHeight;
  px = e.clientX; py = e.clientY;
  swordAnchor.position.x = THREE.MathUtils.clamp(swordAnchor.position.x + dx * 2.2, -1.2, 1.2);
  swordAnchor.position.y = THREE.MathUtils.clamp(swordAnchor.position.y - dy * 2.2, 0.4, 2.4);
  swordAnchor.position.z = 0.9;
  swordAnchor.rotation.y = THREE.MathUtils.clamp(swordAnchor.rotation.y + dx * 4, -1, 1);
});

// ============================================================
// enemy visuals + movement
// ============================================================
function updateEnemies(dt, now) {
  const cam = worldPos(camera);
  for (const e of enemies) {
    const u = e.userData;
    // approach toward player to just inside reach
    const dx = cam.x - e.position.x, dz = cam.z - e.position.z;
    const dist = Math.hypot(dx, dz);
    if (dist > 1.05) {
      const sp = (u.frozenUntil > beatCount ? 0 : 0.55);
      e.position.x += (dx / dist) * sp * dt;
      e.position.z += (dz / dist) * sp * dt;
    }
    e.lookAt(cam.x, e.position.y, cam.z);
    // state visuals
    const frozen = u.frozenUntil > beatCount;
    u.mat.color.setHex(frozen ? 0x88ccff : 0x5b6b8c);
    u.mat.emissive = u.mat.emissive || new THREE.Color(0);
    u.ring.material.opacity = u.state === 'telegraph' ? 0.35 + 0.5 * Math.abs(Math.sin(now * 0.02)) : 0;
    if (u.state === 'telegraph') { u.mat.color.setHex(0xff5533); }
    if (u.burning && now > u.burnUntil) u.burning = false;
    if (u.burning && !frozen) u.mat.color.lerpColors(new THREE.Color(0x5b6b8c), new THREE.Color(0xff6600), 0.5 + 0.5 * Math.sin(now * 0.02));
    e.position.y = 0;
  }
}

// ============================================================
// loop
// ============================================================
function beatVisuals() {
  beatPulse *= 0.86;
  const s = 1 + beatPulse * 0.35;
  beatRing.scale.setScalar(s);
  beatRing.material.opacity = 0.28 + beatPulse * 0.5;
  const onb = isOnBeat();
  beatRing.material.color.setHex(onb ? 0x4ade80 : 0x38bdf8);
  beatdot.style.background = onb ? '#4ade80' : (beatCount % 4 === 0 ? '#38bdf8' : '#334155');
  beatdot.style.boxShadow = onb ? '0 0 12px #4ade80' : 'none';
}

refreshHud();
feedback('find the beat…', '#38bdf8');
let lastT = performance.now();
renderer.setAnimationLoop(() => {
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastT) / 1000);
  lastT = now;
  initAudio();

  // beat clock
  beatClock += dt;
  while (beatClock >= BEAT) { beatClock -= BEAT; onBeat(); }
  beatVisuals();

  cadence = Math.max(0, cadence - CAD_DECAY * dt);

  locomotion(dt);
  handleVerbs(now);
  ensureSwordHeld();
  trackSword();
  tryMelee(now);
  tryBeam(now);
  updateBeams(dt);
  updateForceRings(dt);
  updateEnemies(dt, now);
  checkReload(now);
  refreshHud();

  renderer.render(scene, camera);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
