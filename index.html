<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cadence — rhythm sword VR</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070914; font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: #e6e9ff; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: flex; gap: 16px; align-items: center; padding: 8px 18px; border-radius: 999px;
    background: rgba(8, 10, 22, .72); border: 1px solid rgba(255, 210, 122, .35);
    font-weight: 700; font-size: 14px; user-select: none; white-space: nowrap; backdrop-filter: blur(6px);
  }
  #hud .bar { display: inline-block; width: 110px; height: 9px; background: rgba(255,255,255,.12); border-radius: 5px; overflow: hidden; vertical-align: middle; }
  #hpfill { display: block; height: 100%; width: 100%; background: #4ade80; transition: width .15s; }
  #pips { display: inline-flex; gap: 4px; vertical-align: middle; }
  #pips i { display: inline-block; width: 20px; height: 9px; border-radius: 3px; }
  #elem { min-width: 40px; letter-spacing: .06em; }
  #score { min-width: 60px; text-align: right; font-variant-numeric: tabular-nums; }
  #combo { color: #ffd27a; min-width: 40px; }
  #help {
    position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%); z-index: 10;
    font-size: 12px; line-height: 1.6; text-align: center; color: #9aa3c7; max-width: 94vw;
    background: rgba(8, 10, 22, .6); padding: 6px 16px; border-radius: 10px;
  }
  #help b { color: #ffd27a; font-weight: 700; }
  body.in-vr #hud, body.in-vr #help { display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud">
  <span>♥ <span class="bar"><span id="hpfill"></span></span></span>
  <span>⚡ <span id="pips"></span></span>
  <span id="elem">FIRE</span>
  <span id="combo"></span>
  <span id="score">0</span>
</div>
<div id="help">
  <b>Strike on the beat.</b> Mouse = sword · <b>Q</b> hold grab / release throw · <b>F</b> push · <b>E</b> / <b>1-3</b> element · <b>WASD</b> move · <b>← →</b> or right-drag turn<br>
  Best in a headset: press <b>Enter VR</b>. Add <b>?lefty</b> to the URL to swap hands.
</div>
<script type="module">
  // ?xremu loads a WebXR emulator (Meta IWER) so the VR path can be tested on desktop.
  if (new URLSearchParams(location.search).has('xremu')) {
    const { XRDevice, metaQuest3 } = await import('https://esm.sh/iwer@2');
    const device = new XRDevice(metaQuest3);
    device.installRuntime({ forceInstall: true });
    window.__xr = device;
  }
  await import('./src/main.js');
</script>
</body>
</html>
